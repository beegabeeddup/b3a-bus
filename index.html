<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff2f6">
<title>B3A・B3X 實時班次 · 富泰邨／紅橋 ⇄ 深圳灣口岸</title>
<style>
  :root{
    --bg:#fff2f6;
    --card:#ffffff;
    --card2:#fff6f9;
    --line:#f9d7e4;
    --txt:#422a34;
    --dim:#a98595;
    --pink:#ff5c9a;
    --pink-deep:#ff3d86;
    --green:#2ea86a;
    --red:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:20px 16px;
    background-color:var(--bg);
    background-image:radial-gradient(1000px 520px at 15% -10%,#ffe1ec 0%,var(--bg) 60%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:440px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 18px 44px rgba(255,92,154,.16);
  }
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fff,#fff8fb);
  }
  .topbar h1{font-size:15px;font-weight:700}
  .pill{
    margin-left:auto;flex:none;
    font-size:10.5px;padding:5px 9px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--dim);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .pill.live .dot{background:var(--green);box-shadow:0 0 0 0 rgba(46,168,106,.55);animation:pulse 1.8s infinite}
  .pill.live{color:var(--green);border-color:#cdeedd;background:#f4fdf8}
  .pill.err{color:var(--red);border-color:#f7cccc;background:#fff6f6}
  .pill.err .dot{background:var(--red)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(46,168,106,.5)}
    70%{box-shadow:0 0 0 7px rgba(46,168,106,0)}
    100%{box-shadow:0 0 0 0 rgba(46,168,106,0)}
  }

  /* ---- 可折疊路線 ---- */
  .block + .block{border-top:1px solid var(--line)}
  .block-head{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:14px 16px;
    background:#fff;border:none;font:inherit;color:inherit;
    text-align:left;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .block-head:hover{background:#fffafc}
  .badge{
    flex:none;min-width:60px;text-align:center;
    font-size:19px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(180deg,#ff86b8,#ff4f92);color:#fff;
    padding:8px 10px;border-radius:11px;
    box-shadow:0 6px 16px rgba(255,79,146,.28);
  }
  .block-text{flex:1;min-width:0;display:block}
  .block-name{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
  .block-sum{
    display:block;font-size:11.5px;color:var(--dim);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chev{
    flex:none;width:7px;height:7px;margin:0 4px 3px 2px;
    border-right:1.6px solid var(--dim);border-bottom:1.6px solid var(--dim);
    transform:rotate(45deg);transition:transform .2s ease;
  }
  .block-head[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-bottom:6px}
  .panel{background:#fff}
  .panel[hidden]{display:none}

  .tabs{
    display:flex;gap:6px;
    padding:10px 14px;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,#fff8fb,#fff);
  }
  .tab{
    flex:1;font:inherit;font-size:12px;font-weight:600;color:var(--dim);
    background:#fff6f9;border:1px solid transparent;
    padding:8px 6px;border-radius:10px;cursor:pointer;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
  }
  .tab:hover{color:var(--pink-deep);background:#fff0f6}
  .tab.active{color:#fff;background:linear-gradient(180deg,#ff78ad,#ff4f92);box-shadow:0 4px 12px rgba(255,79,146,.24)}

  .list{padding:4px 12px}
  .row{
    display:flex;align-items:center;gap:12px;
    padding:14px;border-radius:16px;
    background:var(--card2);border:1px solid #fbe3ec;
    margin:8px 0;
    animation:in .35s ease both;
  }
  .row:first-child{
    background:linear-gradient(135deg,#ffe6f0,#fff8fb);
    border-color:#ffc2d8;
    box-shadow:0 6px 16px rgba(255,92,154,.1);
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .min{flex:none;width:66px;text-align:center;line-height:1}
  .min b{font-size:31px;font-weight:800;letter-spacing:-.5px;color:var(--txt)}
  .min span{display:block;font-size:11px;color:var(--dim);margin-top:6px}
  .row:first-child .min b{color:var(--pink-deep)}
  .row:first-child .min span{color:#e58aa9}
  .meta{flex:1;min-width:0}
  .meta .title{font-size:13.5px;font-weight:600;line-height:1.4}
  .meta .sub{font-size:11.5px;color:var(--dim);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now{color:var(--pink-deep);font-weight:700}
  .empty{
    padding:34px 16px 38px;text-align:center;color:var(--dim);
    font-size:13px;line-height:1.7;
  }
  .empty small{font-size:11.5px}

  footer{border-top:1px solid var(--line);padding:12px 14px 16px}
  .btn{
    width:100%;
    font:inherit;font-size:13px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#ff78ad,#ff4f92);
    border:none;padding:12px;border-radius:12px;
    box-shadow:0 8px 18px rgba(255,79,146,.26);
    transition:box-shadow .2s ease,transform .12s ease;
  }
  .btn:hover{box-shadow:0 10px 22px rgba(255,79,146,.34)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.6;cursor:default;box-shadow:none}
  .bar{height:3px;background:#ffe8f0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffa8c8,#ff4f92);width:100%;transition:width 1s linear}
</style>
</head>
<body>
<main class="card">
  <div class="topbar">
    <h1>實時班次</h1>
    <div class="pill" id="status"><span class="dot"></span><span id="statusText">連接中…</span></div>
  </div>

  <!-- B3A：富泰邨 ⇄ 深圳灣口岸 -->
  <section class="block">
    <button class="block-head" id="headA" aria-expanded="false" aria-controls="panelA">
      <span class="badge">B3A</span>
      <span class="block-text">
        <span class="block-name">富泰邨 ⇄ 深圳灣口岸</span>
        <span class="block-sum" id="sumA">載入中…</span>
      </span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel" id="panelA" hidden>
      <div class="tabs" role="tablist" aria-label="B3A 方向">
        <button class="tab active" id="tabAOut" role="tab" aria-selected="true">往深圳灣口岸</button>
        <button class="tab" id="tabAIn" role="tab" aria-selected="false">回富泰邨</button>
      </div>
      <section class="list" id="listA"><div class="empty">載入中…</div></section>
    </div>
  </section>

  <!-- B3X：紅橋 ⇄ 深圳灣口岸 -->
  <section class="block">
    <button class="block-head" id="headB" aria-expanded="false" aria-controls="panelB">
      <span class="badge">B3X</span>
      <span class="block-text">
        <span class="block-name">紅橋 ⇄ 深圳灣口岸</span>
        <span class="block-sum" id="sumB">載入中…</span>
      </span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="panel" id="panelB" hidden>
      <div class="tabs" role="tablist" aria-label="B3X 方向">
        <button class="tab active" id="tabBOut" role="tab" aria-selected="true">往深圳灣口岸</button>
        <button class="tab" id="tabBIn" role="tab" aria-selected="false">回紅橋</button>
      </div>
      <section class="list" id="listB"><div class="empty">載入中…</div></section>
    </div>
  </section>

  <footer>
    <button class="btn" id="btn">立即刷新</button>
  </footer>
  <div class="bar"><i id="bar"></i></div>
</main>

<script>
(function(){
  "use strict";

  // ---- DATA.GOV.HK Citybus (城巴) Open Data API ----
  var BASE   = "https://rt.data.gov.hk/v2/transport/citybus";
  var ETA_MS = 30000;                 // 每 30 秒自動更新

  var ROUTES = {
    aOut: {   // B3A 富泰邨 → 深圳灣口岸（在富泰邨上車）
      dir: "O",
      eta: BASE + "/eta/CTB/003261/B3A",
      arrive: "到站",
      where: "往深圳灣口岸"
    },
    aIn: {    // B3A 深圳灣口岸 → 富泰邨（在深圳灣口岸上車）
      dir: "I",
      eta: BASE + "/eta/CTB/003208/B3A",
      arrive: "開出",
      where: "回富泰邨"
    },
    bOut: {   // B3X 紅橋 → 深圳灣口岸（在紅橋上車）
      dir: "O",
      eta: BASE + "/eta/CTB/003192/B3X",
      arrive: "到站",
      where: "紅橋開往深圳灣口岸"
    },
    bIn: {    // B3X 深圳灣口岸 → 紅橋（在深圳灣口岸上車）
      dir: "I",
      eta: BASE + "/eta/CTB/003208/B3X",
      arrive: "開出",
      where: "深圳灣口岸開往紅橋"
    }
  };

  var statusEl   = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var barEl      = document.getElementById("bar");
  var btn        = document.getElementById("btn");
  var listA      = document.getElementById("listA");
  var listB      = document.getElementById("listB");
  var sumA       = document.getElementById("sumA");
  var sumB       = document.getElementById("sumB");
  var headA      = document.getElementById("headA");
  var headB      = document.getElementById("headB");
  var panelA     = document.getElementById("panelA");
  var panelB     = document.getElementById("panelB");
  var tabAOut    = document.getElementById("tabAOut");
  var tabAIn     = document.getElementById("tabAIn");
  var tabBOut    = document.getElementById("tabBOut");
  var tabBIn     = document.getElementById("tabBIn");

  var viewA       = "aOut";                      // B3A 目前方向
  var viewB       = "bOut";                      // B3X 目前方向
  var data        = { aOut: [], aIn: [], bOut: [], bIn: [] };
  var lastFetchAt = 0;      // 本地時間（ms）
  var serverAt    = 0;      // 伺服器時間（ms，於取得資料時）
  var nextAt      = 0;      // 下次刷新的本地時間
  var firstDone   = false;
  var lastOk      = true;

  function pad(n){ return (n<10?"0":"") + n; }

  // 以伺服器時間為基準（避免用戶端時區／時鐘不準）
  function serverNow(){
    if(!serverAt) return Date.now();
    return serverAt + (Date.now() - lastFetchAt);
  }

  function setStatus(mode, text){
    statusEl.className = "pill" + (mode ? " " + mode : "");
    statusText.textContent = text;
  }

  function getJson(url, timeout){
    return new Promise(function(res, rej){
      var ctrl = ("AbortController" in window) ? new AbortController() : null;
      var t = setTimeout(function(){ if(ctrl) ctrl.abort(); rej(new Error("timeout")); }, timeout || 12000);
      fetch(url, {cache:"no-store", signal: ctrl ? ctrl.signal : undefined})
        .then(function(r){ clearTimeout(t); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function(j){ clearTimeout(t); res(j); })
        .catch(function(e){ clearTimeout(t); rej(e); });
    });
  }

  function minutesTo(iso){
    var t = Date.parse(iso);
    if(isNaN(t)) return null;
    return Math.ceil((t - serverNow()) / 60000);
  }

  function hhmm(iso){
    var d = new Date(Date.parse(iso));
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function rowsFor(key){
    var cfg = ROUTES[key];
    return data[key].filter(function(e){
      return e.dir === cfg.dir;
    }).sort(function(a,b){ return Date.parse(a.eta) - Date.parse(b.eta); });
  }

  function errorHtml(){
    return '<div class="empty">無法連接資料源<br><small>請檢查網絡後再按「立即刷新」</small></div>';
  }

  function listHtml(key){
    if(!lastOk && !firstDone) return errorHtml();

    var cfg  = ROUTES[key];
    var rows = rowsFor(key);

    if(!rows.length){
      return '<div class="empty">暫時沒有' + cfg.where + '的班次<br><small>請稍後再按「立即刷新」</small></div>';
    }

    var html = "";
    rows.slice(0,4).forEach(function(e, i){
      var m = minutesTo(e.eta);
      var big, unit, sub;
      if(m === null){
        big = "–"; unit = "時間待定";
      } else if(m <= 0){
        big = (cfg.dir === "I" ? "開出" : "到站");
        unit = "即將 / 已" + big;
        m = 0;
      } else {
        big = String(m); unit = "分鐘";
      }
      sub = "預計 " + hhmm(e.eta) + " " + cfg.arrive;
      if(e.rmk_tc) sub += " · " + e.rmk_tc;
      var isText = (big === "到站" || big === "開出" || big === "–");

      html += '<div class="row" style="animation-delay:' + (i*70) + 'ms">'
            +   '<div class="min"><b' + (isText ? ' style="font-size:17px"' : '') + '>' + big + '</b><span>' + unit + '</span></div>'
            +   '<div class="meta">'
            +     '<div class="title">' + (i === 0 ? '<span class="now">下一班</span>' : '第 ' + (i+1) + ' 班車') + '</div>'
            +     '<div class="sub">' + sub + '</div>'
            +   '</div>'
            + '</div>';
    });
    return html;
  }

  function summary(key){
    if(!lastOk && !firstDone) return "無法連接資料源";

    var cfg  = ROUTES[key];
    var rows = rowsFor(key);

    if(!rows.length) return firstDone ? "暫時沒有班次" : "載入中…";

    var e = rows[0];
    var m = minutesTo(e.eta);
    var t = hhmm(e.eta);

    if(m === null) return "下一班 時間待定";
    if(m <= 0)     return "下一班 即將" + (cfg.dir === "I" ? "開出" : "到站") + " · " + t;
    return "下一班 " + m + " 分鐘 · " + t + " " + cfg.arrive;
  }

  function render(){
    listA.innerHTML = listHtml(viewA);
    listB.innerHTML = listHtml(viewB);
    sumA.textContent = summary(viewA);
    sumB.textContent = summary(viewB);
  }

  function setTabs(outEl, inEl, isOut){
    outEl.classList.toggle("active", isOut);
    inEl.classList.toggle("active", !isOut);
    outEl.setAttribute("aria-selected", isOut ? "true" : "false");
    inEl.setAttribute("aria-selected", isOut ? "false" : "true");
  }

  function selectA(key){
    viewA = key;
    setTabs(tabAOut, tabAIn, key === "aOut");
    listA.innerHTML = listHtml(key);
    sumA.textContent = summary(key);
  }

  function selectB(key){
    viewB = key;
    setTabs(tabBOut, tabBIn, key === "bOut");
    listB.innerHTML = listHtml(key);
    sumB.textContent = summary(key);
  }

  function bindToggle(head, panel){
    head.addEventListener("click", function(){
      var open = head.getAttribute("aria-expanded") === "true";
      head.setAttribute("aria-expanded", open ? "false" : "true");
      panel.hidden = open;
    });
  }

  function loadDir(key){
    return getJson(ROUTES[key].eta).then(function(j){
      data[key] = Array.isArray(j.data) ? j.data : [];
      var ts = Date.parse(j.generated_timestamp || "");
      if(!isNaN(ts)){ serverAt = ts; lastFetchAt = Date.now(); }
      return true;
    }).catch(function(){ return false; });
  }

  function tick(){
    if(!nextAt) return;
    var left = Math.max(0, nextAt - Date.now());
    barEl.style.width = Math.max(0, Math.min(100, (left / ETA_MS) * 100)) + "%";
    if(left <= 0 && !document.hidden) refresh();
  }

  function refresh(){
    if(btn.disabled) return;
    btn.disabled = true;
    btn.textContent = "更新中…";

    var tasks = [loadDir("aOut"), loadDir("aIn"), loadDir("bOut"), loadDir("bIn")];

    Promise.all(tasks).then(function(ok){
      lastOk = ok[0] || ok[1] || ok[2] || ok[3];
      render();
      if(lastOk){
        firstDone = true;
        setStatus("live", "即時");
      }else{
        setStatus("err", firstDone ? "更新失敗" : "無法連接");
      }
    }).then(function(){
      btn.disabled = false;
      btn.textContent = "立即刷新";
      nextAt = Date.now() + ETA_MS;   // 固定每 30 秒一次
      barEl.style.width = "100%";
    });
  }

  bindToggle(headA, panelA);
  bindToggle(headB, panelB);
  tabAOut.addEventListener("click", function(){ selectA("aOut"); });
  tabAIn.addEventListener("click", function(){ selectA("aIn"); });
  tabBOut.addEventListener("click", function(){ selectB("bOut"); });
  tabBIn.addEventListener("click", function(){ selectB("bIn"); });
  btn.addEventListener("click", function(){ nextAt = 0; refresh(); });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && Date.now() >= nextAt) refresh();
  });

  setInterval(tick, 1000);
  refresh();
  tick();
})();
</script>
</body>
</html>
